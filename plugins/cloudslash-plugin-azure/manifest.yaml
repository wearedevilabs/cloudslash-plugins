name: azure
version: 2.0.0
type: plugin
author: DrSkyle
description: Azure data-source plugin for CloudSlash — discovers resources and emits canonical CRN graph data
tags: [azure, microsoft, cloud, infrastructure]
cloudslash_min_version: 2.0.0

provider:
  name: azure
  regions:
    - eastus
    - westus
    - centralus
    - northeurope
    - westeurope
    - southeastasia

capabilities:
  discovery: true
  rightsize: false
  pricing: false

# Least-privilege roles this plugin requires.
permissions:
  azure:
    read:
      - Microsoft.Compute/virtualMachines/read
      - Microsoft.Compute/disks/read
      - Microsoft.Storage/storageAccounts/read
      - Microsoft.ContainerService/managedClusters/read
      - Microsoft.DBforMySQL/servers/read
      - Microsoft.Cache/Redis/read
