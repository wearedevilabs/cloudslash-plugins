name: aws
version: 2.0.0
type: plugin
author: DrSkyle
description: AWS data-source plugin for CloudSlash — discovers resources and emits canonical CRN graph data
tags: [aws, cloud, infrastructure]
cloudslash_min_version: 2.0.0

# Least-privilege read actions used for discovery and metric enrichment.
permissions:
  aws:
    read:
      - sts:GetCallerIdentity
      - ec2:DescribeInstances
      - ec2:DescribeVolumes
      - ec2:DescribeNatGateways
      - ec2:DescribeAddresses
      - ec2:DescribeSnapshots
      - ec2:DescribeImages
      - ec2:DescribeVolumesModifications
      - ec2:DescribeInstanceTypes
      - ec2:DescribeInstanceAttribute
      - s3:ListAllMyBuckets
      - s3:GetBucketLocation
      - s3:GetBucketLifecycleConfiguration
      - s3:HeadBucket
      - s3:ListBucketMultipartUploads
      - rds:DescribeDBInstances
      - eks:ListClusters
      - eks:DescribeCluster
      - ecs:ListClusters
      - ecs:DescribeClusters
      - ecs:ListServices
      - ecs:DescribeServices
      - ecs:ListContainerInstances
      - ecs:DescribeContainerInstances
      - ecs:DescribeTaskDefinition
      - elasticache:DescribeCacheClusters
      - redshift:DescribeClusters
      - dynamodb:ListTables
      - dynamodb:DescribeTable
      - lambda:ListFunctions
      - elasticloadbalancing:DescribeLoadBalancers
      - wafv2:GetWebACL
      - route53:ListHostedZones
      - cloudwatch:GetMetricStatistics
